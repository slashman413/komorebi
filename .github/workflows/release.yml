name: Release to itch.io

# On a v* tag, export Linux + Windows and push them to itch.io via butler.
#
# One-time setup by the account owner (see LAUNCH.md):
#   1. Create the itch.io project page:  slashman413/komorebi
#   2. Generate an API key at https://itch.io/user/settings/api-keys
#   3. Add it as a repo secret named BUTLER_API_KEY
# Without the secret the job no-ops with a clear message (never fails the tag).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  ITCH_TARGET: "slashman413/komorebi"

jobs:
  export-and-publish:
    name: Export + butler push
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.5
    strategy:
      matrix:
        include:
          - preset: "Linux"
            outfile: "komorebi.x86_64"
            channel: "linux"
          - preset: "Windows Desktop"
            outfile: "komorebi.exe"
            channel: "windows"
    steps:
      - uses: actions/checkout@v4

      - name: Provision export templates
        run: |
          set -eux
          # Same self-healing provisioning as ci.yml: derive the template dir
          # from the installed engine (godot --headless --version ->
          # 3.5.stable.official.991bb6ac7 -> dir 3.5.stable) instead of
          # hardcoding a version. Godot 3.x keeps templates under templates/;
          # the image has them under /root, this job's HOME (/github/home)
          # is different, so copy them into place.
          GODOT_FULL="$(godot --headless --version 2>/dev/null || true)"
          GODOT_TPL="$(printf '%s' "$GODOT_FULL" | cut -d. -f1-3)"
          [ -n "$GODOT_TPL" ] || { echo "::error::could not determine godot version"; exit 1; }
          echo "Engine ${GODOT_FULL} -> templates ${GODOT_TPL}"
          mkdir -p "$HOME/.local/share/godot/templates"
          for base in /root/.local/share/godot/templates /root/.local/share/godot/export_templates; do
            if [ -d "$base/$GODOT_TPL" ]; then
              cp -r "$base/$GODOT_TPL" "$HOME/.local/share/godot/templates/" || true
              break
            fi
          done
          test -d "$HOME/.local/share/godot/templates/$GODOT_TPL" \
            || { echo "::error::export templates for ${GODOT_TPL} not found"; exit 1; }

      - name: Import project
        run: godot --headless --path . --import --quit 2>&1 | tee import.log

      - name: Export ${{ matrix.preset }}
        env:
          PRESET: ${{ matrix.preset }}
          OUTFILE: ${{ matrix.outfile }}
        run: |
          set -eux
          mkdir -p build/"$PRESET"
          # Godot 3.x CLI uses `--export`; `--export-release` is Godot 4.x
          # syntax that 3.x silently ignores (boots main scene -> hangs).
          timeout 300 godot --headless --path . --export "$PRESET" "build/$PRESET/$OUTFILE"
          ls -la "build/$PRESET"

      - name: Publish to itch.io via butler
        if: ${{ env.BUTLER_HAS_KEY == 'true' }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          PRESET: ${{ matrix.preset }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          butler push "build/$PRESET" "$ITCH_TARGET:$CHANNEL" --userversion "$VERSION"

      - name: No API key — skip publish
        if: ${{ env.BUTLER_HAS_KEY != 'true' }}
        run: |
          echo "BUTLER_API_KEY secret not set — export succeeded, itch.io publish skipped."
          echo "Add the secret (see LAUNCH.md) to enable automatic itch.io deploys on v* tags."
    env:
      BUTLER_HAS_KEY: ${{ secrets.BUTLER_API_KEY != '' }}
