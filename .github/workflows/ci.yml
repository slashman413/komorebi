name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1: import the project, prove every script parses, run headless tests.
  # Nothing downstream runs unless this is green.
  # ---------------------------------------------------------------------------
  import-and-test:
    name: Import + Parse Gate + Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.5
    steps:
      - uses: actions/checkout@v4

      - name: Provision export templates
        run: |
          set -eux
          # Derive the template dir from the installed engine so it can never
          # drift from the barichello/godot-ci image. godot --version prints
          # e.g. "3.5.stable.official.991bb6ac7"; the template dir is the
          # first three dot-separated fields ("3.5.stable"). --headless is
          # required: without it godot tries to init a display and exits 255
          # inside a container, which set -e would treat as a failure.
          GODOT_FULL="$(godot --headless --version 2>/dev/null || true)"
          GODOT_TPL="$(printf '%s' "$GODOT_FULL" | cut -d. -f1-3)"
          [ -n "$GODOT_TPL" ] || { echo "::error::could not determine godot version"; exit 1; }
          echo "Engine ${GODOT_FULL} -> templates ${GODOT_TPL}"
          mkdir -p "$HOME/.local/share/godot/templates"
          # Godot 3.x keeps templates under templates/, Godot 4.x under
          # export_templates/. The image has them under /root; this job's HOME
          # (/github/home) is different, so copy them into place. Only one of
          # the two layouts exists per engine, so probe both.
          for base in /root/.local/share/godot/templates /root/.local/share/godot/export_templates; do
            if [ -d "$base/$GODOT_TPL" ]; then
              cp -r "$base/$GODOT_TPL" "$HOME/.local/share/godot/templates/" || true
              break
            fi
          done
          ls -la "$HOME/.local/share/godot/templates/" || true
          test -d "$HOME/.local/share/godot/templates/$GODOT_TPL" \
            || { echo "::error::export templates for ${GODOT_TPL} not found"; exit 1; }

      - name: Import project (populates .godot/, compiles scripts)
        run: |
          set -eux
          # Godot 3.5 --import boots the main scene and never exits on its own;
          # --quit quits after the first frame (same behavior as daily-tests.yml).
          godot --headless --path . --import --quit 2>&1 | tee import.log



      - name: Parse gate (log scan backstop)
        run: |
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then
            echo "::error::Script/parse errors found during import"
            grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log || true
            exit 1
          fi
          echo "No parse errors in import log."

      - name: Headless tests (exit code gates the job)
        run: |
          set -eux
          godot --headless --path . --script res://tests/run_tests.gd

      - name: HoldGraph Validator (exit code gates the job)
        run: |
          set -eux
          godot --headless --path . --script res://tools/validate_hold_graph.gd

      - name: Content Linter (exit code gates the job)
        run: |
          set -eux
          godot --headless --path . --script res://tools/content_linter.gd

  # ---------------------------------------------------------------------------
  # Gate 2: export Windows + Linux and upload the binaries as artifacts.
  # ---------------------------------------------------------------------------
  export:
    name: Export ${{ matrix.name }}
    needs: import-and-test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            preset: "Linux"
            outdir: linux
            binary: komorebi.x86_64
          - name: Windows
            preset: "Windows Desktop"
            outdir: windows
            binary: komorebi.exe
    steps:
      - uses: actions/checkout@v4

      - name: Provision export templates
        run: |
          set -eux
          # Same self-healing provisioning as the import job: derive the
          # template dir from the installed engine (godot --headless --version
          # -> 3.5.stable.official.991bb6ac7 -> dir 3.5.stable) instead of
          # hardcoding a version the image does not ship.
          GODOT_FULL="$(godot --headless --version 2>/dev/null || true)"
          GODOT_TPL="$(printf '%s' "$GODOT_FULL" | cut -d. -f1-3)"
          [ -n "$GODOT_TPL" ] || { echo "::error::could not determine godot version"; exit 1; }
          echo "Engine ${GODOT_FULL} -> templates ${GODOT_TPL}"
          mkdir -p "$HOME/.local/share/godot/templates"
          for base in /root/.local/share/godot/templates /root/.local/share/godot/export_templates; do
            if [ -d "$base/$GODOT_TPL" ]; then
              cp -r "$base/$GODOT_TPL" "$HOME/.local/share/godot/templates/" || true
              break
            fi
          done
          test -d "$HOME/.local/share/godot/templates/$GODOT_TPL" \
            || { echo "::error::export templates for ${GODOT_TPL} not found"; exit 1; }

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Export ${{ matrix.name }}
        run: |
          set -eux
          mkdir -p "build/${{ matrix.outdir }}"
          # Godot 3.x CLI uses `--export` (release template by default);
          # `--export-release` is Godot 4.x syntax and is silently ignored
          # by 3.x, which then boots the main scene and hangs forever.
          # timeout is a hard backstop so a hang fails the job instead of
          # zombie-ing until the 6h limit (same pattern as daily-tests.yml).
          timeout 300 godot --headless --path . \
            --export "${{ matrix.preset }}" \
            "build/${{ matrix.outdir }}/${{ matrix.binary }}"
          ls -la "build/${{ matrix.outdir }}"

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: komorebi-${{ matrix.outdir }}
          path: build/${{ matrix.outdir }}
          if-no-files-found: error
